modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="lach_01298, sanrom, zalgo, WuzgXY, igntuman, rtxyd, Pu-238, Determancer, tomdodd4598, FishingPole"
description='''A Nuclearcraft addon that brings particle accelerators and particle physics to Minecraft.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="nuclearcraftneohaul"
type="required"
versionRange="${neohaul_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[${kubejs_version},)"
ordering="NONE"
side="BOTH"
