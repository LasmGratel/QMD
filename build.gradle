plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.diffplug.spotless' version '8.11.0'
}

// Keep the tested Neohaul release and its required dependencies in one place.
def dependencyVersions = new Properties()
file('build.properties').withInputStream { dependencyVersions.load(it) }
dependencyVersions.each { key, value -> ext.set(key.toString(), value) }
def withKubeJS = providers.gradleProperty('withKubeJS')
        .map { it.isEmpty() || it.toBoolean() }.getOrElse(false)

version = mod_version
group = mod_group_id
base.archivesName = mod_jarname + "-" + minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

spotless {
    encoding 'UTF-8'

    format 'misc', {
        target '.gitignore'

        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java' // exclude api as they are not our files
        def formatFile = rootProject.file('spotless/spotless.eclipseformat.xml')

        toggleOffOn()
        removeUnusedImports()
        endWithNewline()
        leadingTabsToSpaces(4)
        //noinspection GroovyAssignabilityCheck
        eclipse('4.19').configFile(formatFile)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.rtyley' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**'
}

// A resource belongs to either the authored or generated tree, never both.
tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

sourceSets {
    data {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    dataImplementation.extendsFrom implementation
    dataRuntimeOnly.extendsFrom runtimeOnly
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // This is an alternate folder group for the same qmd metadata, not a second loaded mod.
        qmdGameTest {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
        qmdData {
            sourceSet sourceSets.main
            sourceSet sourceSets.data
        }
    }
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [neoForge.mods.qmdGameTest]
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            sourceSet = sourceSets.data
            loadedMods = [neoForge.mods.qmdData]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'nuclearcraftneohaul'
        }
    }
    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.data
    unitTest {
        enable()
        loadedMods = [neoForge.mods."${mod_id}"]
        testedMod = mods."${mod_id}"
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

def gameTestLog = layout.projectDirectory.file('run/gametest/logs/latest.log')
tasks.named('runGameTestServer') {
    doFirst {
        // A bootstrap failure can exit with code zero before GameTests run. Never accept an old summary.
        def logFile = gameTestLog.asFile
        if (logFile.exists() && !logFile.delete()) {
            throw new GradleException("Cannot clear the previous GameTest log: ${logFile}")
        }
    }
    doLast {
        def logFile = gameTestLog.asFile
        if (!logFile.exists() || !(logFile.getText('UTF-8') =~ /All [1-9][0-9]* required tests passed/).find()) {
            throw new GradleException("GameTests did not report a successful required-test summary. Inspect ${logFile}")
        }
    }
}

if (withKubeJS) {
    def startupFixtures = tasks.register('syncGameTestKubeJSStartupScripts', Sync) {
        from 'src/gameTest/kubejs/startup_scripts'
        into layout.projectDirectory.dir('run/gametest/kubejs/startup_scripts')
    }
    def serverFixtures = tasks.register('syncGameTestKubeJSServerScripts', Sync) {
        from 'src/gameTest/kubejs/server_scripts'
        into layout.projectDirectory.dir('run/gametest/kubejs/server_scripts')
    }
    def prepareGameTestKubeJS = tasks.register('prepareGameTestKubeJS') {
        // Each Sync owns only its script directory, so renamed fixtures cannot leave stale scripts.
        // KubeJS config, logs and other files under the root directory remain outside these tasks.
        dependsOn startupFixtures, serverFixtures
    }
    tasks.named('runGameTestServer') { dependsOn prepareGameTestKubeJS }
}

dependencies {
    implementation "maven.modrinth:${neohaul_project_id}:${neohaul_file_id}"
    implementation "curse.maven:zerocore-247921:${zerocore_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "maven.modrinth:nU0bVIaL:BIogJv2D"

    // Neohaul eagerly constructs its Curios provider even for --mod qmd.
    // Keep the workaround local to data generation instead of all game runs.
    dataRuntimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_datagen_version}"

    // Optional integration: the base mod must also load without KubeJS.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    if (withKubeJS) {
        localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            neohaul_version_range: neohaul_version_range,
            kubejs_version: kubejs_version,
            jei_version: jei_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('wrapper', Wrapper).configure { distributionType = Wrapper.DistributionType.BIN }

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
